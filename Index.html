<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohana Lagoon Nighttime Feed</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #player {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="player"></div>

<script>
  // Load the YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  let player;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: 'LZvoiZrAd2U',

      playerVars: {
        autoplay: 0,
        controls: 1,
        rel: 0,
        playsinline: 1
      }
    });
  }
</script>

</body>
</html>
