=================================================

=================================================
*/

  if (nightActive) {
    return;

  nightActive = true;


  trigger(
    "/show/nightstart"
  );


  nightTimer =
    setInterval(
      function () {

        if (!nightActive) {

        }


        trigger(
          "/show/nightblue"
        );

      },

      6500
    );

}


/*

=================================================

  nightActive = false;

/*
=================================================
ENTER CUE
=================================================
*/

function enterCue(cue) {

  document
    .getElementById(
      "cue"
    )
    .innerHTML =
    cue.label;


  if (
    cue.type === "night"
  ) {

    stopNightSky();

    startNightSky();

    return;

  }


  if (
    cue.type === "dark"
  ) {

    stopNightSky();

    return;

  }


  if (
    cue.type === "nightreset"
  ) {

    stopNightSky();


    trigger(
      "/show/nightreset"
    );


    setTimeout(
      function () {

        startNightSky();

      },

      1400
    );


    return;

  }


  stopNightSky();


  if (
    cue.action
  ) {

    trigger(
      cue.action
    );

  }

}


/*
=================================================
SHOW ENGINE
=================================================
*/

function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime
      !== "function"
  ) {

    return;

  }


  const t =
    player.getCurrentTime();


  document
    .getElementById(
      "time"
    )
    .innerHTML =
    "Video time: " +
    formatTime(t);


  if (
    previousVideoTime > 1300 &&
    t < 10
  ) {

    lastCue = null;

    stopNightSky();

  }


  previousVideoTime = t;


  let active = null;


  for (
    const cue of cues
  ) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;

    }

  }


  if (!active) {
    return;
  }


  if (
    active.id !== lastCue
  ) {

    lastCue =
      active.id;


    enterCue(
      active
    );

  }

}


/*
=================================================
YOUTUBE PLAYER
=================================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          VIDEO_ID,


        playerVars: {

          controls: 1,

          playsinline: 1,

          rel: 0,

          loop: 1,

          playlist:
            VIDEO_ID

        },


        events: {

          onReady:
            function () {

              document
                .getElementById(
                  "time"
                )
                .innerHTML =
                "Player ready — press PLAY";

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                lastCue = null;

                previousVideoTime = 0;

                stopNightSky();

              }

            }

        }

      }
    );

}


/*
=================================================
TIME DISPLAY
=================================================
*/

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(
        2,
        "0"
      ) +
    "." +
    tenths
  );

}


setInterval(
