
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohana Lagoon Nighttime Feed</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #player {
      width: 100vw;
      height: 100vh;
    }

    #testMessage {
      position: fixed;
      top: 40%;
      left: 0;
      width: 100%;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 72px;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.85);
      padding: 30px 0;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>

<div id="player"></div>
<div id="testMessage">LIGHTS OFF</div>

<script>
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  let player;
  let timer;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: 'LZvoiZrAd2U',
      playerVars: {
        autoplay: 0,
        controls: 1,
        rel: 0,
        playsinline: 1
      },
      events: {
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
      if (!timer) {
        timer = setInterval(checkTime, 100);
      }
    }

    if (
      event.data === YT.PlayerState.PAUSED ||
      event.data === YT.PlayerState.ENDED
    ) {
      clearInterval(timer);
      timer = null;
    }
  }

  function checkTime() {
    const currentTime = player.getCurrentTime();
    const message = document.getElementById('testMessage');

    if (currentTime >= 10 && currentTime < 13) {
      message.style.display = 'block';
    } else {
      message.style.display = 'none';
    }
  }
</script>

</body>
</html>
