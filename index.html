function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime !== "function"
  ) {
    return;
  }

  const t =
    player.getCurrentTime();


  document.getElementById("time")
    .innerHTML =
    "Video time: " +
    formatTime(t);


  let active = null;


  for (const cue of cues) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;
    }

  }


  if (!active) {
    return;
  }


  document.getElementById("cue")
    .innerHTML =
    active.label;


  if (active.id !== lastCue) {

    lastCue =
      active.id;

    trigger(
      active.action
    );

  }

}


function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          "LZvoiZrAd2U",

        playerVars: {
          controls: 1,
          playsinline: 1,
          rel: 0
        },

        events: {

          onReady:
            function () {

              document
                .getElementById("time")
                .innerHTML =
                "Player ready — press PLAY";

            }

        }

      }
    );

}


function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(2, "0") +
    "." +
    tenths
  );

}

const tag =
  document.createElement(

  );

const firstScriptTag =

    )[0];


firstScriptTag
