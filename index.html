function trigger(path) {

  fetch(
    WORKER + path
  )

    error => {

      console.log(
        "Worker error:",
        error
      );

    }
  );

}


/*
=================================================
START TRANQUIL LIGHTING
=================================================
*/

function startNightSky() {

  if (nightActive) {
    return;
  }


  nightActive = true;

  nightIndex = 0;


  /*
  Start in BLUE.
  */

  trigger(
    "/show/nightstart"
  );


  /*
  Alternate BLUE / YELLOW
  every 5.5 seconds.
  */

  nightTimer =
    setInterval(
      function () {

        if (!nightActive) {
          return;
        }


        nightIndex =
          (nightIndex + 1) %
          nightStates.length;


        trigger(
          nightStates[
            nightIndex
          ]
        );

      },

      5500
    );

}


/*
=================================================
STOP TRANQUIL LIGHTING
=================================================
*/

function stopNightSky() {

  nightActive = false;


  if (
    nightTimer !== null
  ) {

    clearInterval(
      nightTimer
    );

    nightTimer = null;

  }

}

/*
=================================================
ENTER CUE
=================================================
*/

function enterCue(cue) {

  document
    .getElementById(
      "cue"
    )
    .innerHTML =
    cue.label;


  // =============================================
  // NORMAL TRANQUIL LIGHTING
  // =============================================

  if (
    cue.type === "night"
  ) {

    stopNightSky();

    startNightSky();

    return;

  }


  // =============================================
  // DARKNESS BETWEEN STRIKES
  // =============================================

  if (
    cue.type === "dark"
  ) {

    stopNightSky();

    return;

  }


  // =============================================
  // STORM FINISHED
  // =============================================

  if (
    cue.type === "nightreset"
  ) {

    stopNightSky();


    trigger(
      "/show/nightreset"
    );


    /*
    Resume alternating BLUE/YELLOW
    shortly after the initial blue return.
    */

    setTimeout(
      function () {

        startNightSky();

      },

      1400
    );


    return;

  }


  // =============================================
  // SCENE / LIGHTNING / BLACKOUT
  // =============================================

  stopNightSky();


  if (
    cue.action
  ) {

    trigger(
      cue.action
    );

  }

}


/*
=================================================
SHOW ENGINE
=================================================
*/

function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime
      !== "function"
  ) {

    return;

  }


  const t =
    player.getCurrentTime();


  document
    .getElementById(
      "time"
    )
    .innerHTML =
    "Video time: " +
    formatTime(t);


  /*
  Detect automatic video loop.
  */

  if (
    previousVideoTime > 1300 &&
    t < 10
  ) {

    lastCue = null;

    stopNightSky();

  }


  previousVideoTime = t;


  let active = null;


  for (
    const cue of cues
  ) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;

    }

  }


  if (!active) {
    return;
  }


  if (
    active.id !== lastCue
  ) {

    lastCue =
      active.id;


    enterCue(
      active
    );

  }

}


/*
=================================================
YOUTUBE PLAYER
=================================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          VIDEO_ID,


        playerVars: {

          controls: 1,

          playsinline: 1,

          rel: 0,

          loop: 1,

          playlist:
            VIDEO_ID

        },


        events: {

          onReady:
            function () {

              document
                .getElementById(
                  "time"
                )
                .innerHTML =
                "Player ready — press PLAY";

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                lastCue = null;

                previousVideoTime = 0;

                stopNightSky();

              }

            }

        }

      }
    );

}


/*
=================================================
TIME DISPLAY
=================================================
*/

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );


  const secs =
    Math.floor(
      seconds % 60
    );


  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(
        2,
        "0"
      ) +
    "." +
    tenths
  );

}
