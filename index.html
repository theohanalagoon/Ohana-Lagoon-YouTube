/*
========================================
TRANQUIL NIGHT ENGINE
========================================
*/

let nightTimer = null;

let fireflyTimer = null;

let nightIndex = 0;

let nightActive = false;

let fireflyInProgress = false;


const nightStates = [

  "/show/night1",

  "/show/night2",

  "/show/night4",

  "/show/night1",

  "/show/night3",

  "/show/night2",

  "/show/night4"

];


function trigger(path) {

  fetch(WORKER + path)
    .catch(error => {

      console.log(
        "Worker error:",
        error
      );

    });

}


/*
========================================
START NIGHT SKY
========================================
*/

function startNightSky() {

  if (nightActive) {
    return;
  }


  nightActive = true;

  nightIndex = 0;


  trigger(
    nightStates[nightIndex]
  );


  nightTimer =
    setInterval(
      function () {

        if (
          !nightActive ||
          fireflyInProgress
        ) {
          return;
        }


        nightIndex =
          (nightIndex + 1) %
          nightStates.length;


        trigger(
          nightStates[nightIndex]
        );

      },

      6500
    );


  scheduleNextFirefly();

}


/*
========================================
STOP NIGHT SKY
========================================
*/

function stopNightSky() {

  nightActive = false;

  fireflyInProgress = false;


  if (nightTimer !== null) {

    clearInterval(
      nightTimer
    );

    nightTimer = null;

  }


  if (fireflyTimer !== null) {

    clearTimeout(
      fireflyTimer
    );

    fireflyTimer = null;

  }

}


/*
========================================
FIREFLIES
========================================
*/

function scheduleNextFirefly() {

  if (!nightActive) {
    return;
  }


  const delay =
    12000 +
    Math.random() * 8000;


  fireflyTimer =
    setTimeout(
      function () {

        runFirefly();

      },

      delay
    );

}


function runFirefly() {

  if (
    !nightActive ||
    fireflyInProgress
  ) {

    scheduleNextFirefly();

    return;

  }


  fireflyInProgress = true;


  const returnState =
    nightStates[nightIndex];


  trigger(
    "/show/firefly"
  );


  setTimeout(
    function () {

      if (nightActive) {

        trigger(
          returnState
        );

      }


      fireflyInProgress = false;


      if (nightActive) {

        scheduleNextFirefly();

      }

    },

    1100
  );

}

/*
========================================
ENTER CUE
========================================
*/

function enterCue(cue) {

  document
    .getElementById("cue")
    .innerHTML =
    cue.label;


  if (cue.type === "night") {

    stopNightSky();

    startNightSky();

    return;

  }


  if (cue.type === "nightreset") {

    stopNightSky();


    /*
    nightreset starts by immediately
    turning BOTH strips OFF.

    That guarantees no lingering white
    lightning after 21:51.
    */

    trigger(
      "/show/nightreset"
    );


    /*
    Restart the tranquil color cycling
    only after reset has completed.
    */

    setTimeout(
      function () {

        startNightSky();

      },

      4200
    );


    return;

  }


  stopNightSky();


  if (cue.action) {

    trigger(
      cue.action
    );

  }

}


/*
========================================
SHOW ENGINE
========================================
*/

function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime !== "function"
  ) {
    return;
  }


  const t =
    player.getCurrentTime();


  document
    .getElementById("time")
    .innerHTML =
    "Video time: " +
    formatTime(t);


  if (
    previousVideoTime > 1300 &&
    t < 10
  ) {

    lastCue = null;

    stopNightSky();

  }


  previousVideoTime = t;


  let active = null;


  for (const cue of cues) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;

    }

  }


  if (!active) {
    return;
  }


  if (active.id !== lastCue) {

    lastCue =
      active.id;

    enterCue(
      active
    );

  }

}


/*
========================================
YOUTUBE
========================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          VIDEO_ID,

        playerVars: {

          controls: 1,

          playsinline: 1,

          rel: 0,

          loop: 1,

          playlist:
            VIDEO_ID

        },

        events: {

          onReady:
            function () {

              document
                .getElementById("time")
                .innerHTML =
                "Player ready — press PLAY";

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                lastCue = null;

                previousVideoTime = 0;

                stopNightSky();

              }

            }

        }

      }
    );

}


/*
========================================
TIME DISPLAY
========================================
*/

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(2, "0") +
    "." +
    tenths
  );

}
