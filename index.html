/*
========================================
TRANQUIL NIGHT ENGINE
========================================
*/

let nightTimer = null;

let fireflyTimer = null;

let nightIndex = 0;

let nightActive = false;

let fireflyInProgress = false;


/*
The order intentionally avoids making
the sky feel like a simple four-color loop.
*/

const nightStates = [

  "/show/night1",

  "/show/night2",

  "/show/night4",

  "/show/night1",

  "/show/night3",

  "/show/night2",

  "/show/night4"

];


function trigger(path) {

  fetch(WORKER + path)
    .catch(error => {

      console.log(
        "Worker error:",
        error
      );

    });

}


/*
========================================
NIGHT-SKY COLOR CYCLE
========================================
*/

function startNightSky() {

  if (nightActive) {
    return;
  }


  nightActive = true;

  nightIndex = 0;


  trigger(
    nightStates[nightIndex]
  );


  /*
  Gentle sky change every 6.5 seconds.
  */

  nightTimer =
    setInterval(
      function () {

        if (
          !nightActive ||
          fireflyInProgress
        ) {
          return;
        }


        nightIndex =
          (nightIndex + 1) %
          nightStates.length;


        trigger(
          nightStates[nightIndex]
        );

      },

      6500
    );


  /*
  Start independent firefly scheduling.
  */

  scheduleNextFirefly();

}


/*
========================================
STOP TRANQUIL NIGHT
========================================
*/

function stopNightSky() {

  nightActive = false;

  fireflyInProgress = false;


  if (nightTimer !== null) {

    clearInterval(
      nightTimer
    );

    nightTimer = null;

  }


  if (fireflyTimer !== null) {

    clearTimeout(
      fireflyTimer
    );

    fireflyTimer = null;

  }

}


/*
========================================
FIREFLY SCHEDULER
========================================
*/

function scheduleNextFirefly() {

  if (!nightActive) {
    return;
  }


  /*
  Random delay:
  12 to 20 seconds.

  This keeps the fireflies from becoming
  predictable.
  */

  const delay =
    12000 +
    Math.random() * 8000;


  fireflyTimer =
    setTimeout(
      function () {

        runFirefly();

      },

      delay
    );

}


/*
========================================
FIREFLY
========================================
*/

function runFirefly() {

  if (
    !nightActive ||
    fireflyInProgress
  ) {

    scheduleNextFirefly();

    return;

  }


  fireflyInProgress = true;


  /*
  Remember the exact night color
  that was active before the firefly.
  */

  const returnState =
    nightStates[nightIndex];


  /*
  Brief golden-yellow glow.
  */

  trigger(
    "/show/firefly"
  );


  /*
  After roughly one second,
  return to the sky color that
  was active before the firefly.
  */

  setTimeout(
    function () {

      if (nightActive) {

        trigger(
          returnState
        );

      }


      fireflyInProgress = false;


      /*
      Schedule another unpredictable
      firefly later.
      */

      if (nightActive) {

        scheduleNextFirefly();

      }

    },

    1100
  );

}

/*
========================================
ENTER NEW CUE
========================================
*/

function enterCue(cue) {

  document
    .getElementById("cue")
    .innerHTML =
    cue.label;


  /*
  NORMAL TRANQUIL SECTION
  */

  if (cue.type === "night") {

    stopNightSky();

    startNightSky();

    return;

  }


  /*
  AFTER STORM
  */

  if (cue.type === "nightreset") {

    stopNightSky();


    trigger(
      "/show/nightreset"
    );


    /*
    Wait for the deliberate storm reset
    to finish before restarting shimmer
    and fireflies.
    */

    setTimeout(
      function () {

        startNightSky();

      },

      5000
    );


    return;

  }


  /*
  SPECIAL SCENE
  */

  stopNightSky();


  if (cue.action) {

    trigger(
      cue.action
    );

  }

}


/*
========================================
SHOW ENGINE
========================================
*/

function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime !== "function"
  ) {
    return;
  }


  const t =
    player.getCurrentTime();


  document
    .getElementById("time")
    .innerHTML =
    "Video time: " +
    formatTime(t);


  /*
  Detect automatic video loop.
  */

  if (
    previousVideoTime > 1300 &&
    t < 10
  ) {

    lastCue = null;

    stopNightSky();

  }


  previousVideoTime = t;


  let active = null;


  for (const cue of cues) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;

    }

  }


  if (!active) {
    return;
  }


  if (active.id !== lastCue) {

    lastCue =
      active.id;

    enterCue(
      active
    );

  }

}


/*
========================================
YOUTUBE PLAYER
========================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          VIDEO_ID,

        playerVars: {

          controls: 1,

          playsinline: 1,

          rel: 0,

          loop: 1,

          playlist:
            VIDEO_ID

        },

        events: {

          onReady:
            function () {

              document
                .getElementById("time")
                .innerHTML =
                "Player ready — press PLAY";

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                lastCue = null;

                previousVideoTime = 0;

                stopNightSky();

              }

            }

        }

      }
    );

}


/*
========================================
TIME DISPLAY
========================================
*/

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(2, "0") +
    "." +
    tenths
  );

}

========================================
*/

    )[0];
