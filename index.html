<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Ohana Lagoon Test</title>

  <style>
    html, body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    #player {
      width: 100vw;
      height: 75vh;
    }

    #debug {
      font-size: 32px;
      text-align: center;
      padding: 20px;
    }

    #testMessage {
      position: fixed;
      top: 30%;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 80px;
      font-weight: bold;
      background: black;
      padding: 40px 0;
      display: none;
      z-index: 9999;
    }
  </style>
</head>

<body>

<div id="player"></div>

<div id="debug">
  Waiting for player...
</div>

<div id="testMessage">
  LIGHTS OFF
</div>

<script>
  let player;

  function onYouTubeIframeAPIReady() {
    document.getElementById('debug').innerHTML = 'YouTube API loaded';

    player = new YT.Player('player', {
      videoId: 'LZvoiZrAd2U',
      playerVars: {
        controls: 1,
        playsinline: 1
      },
      events: {
        onReady: function () {
          document.getElementById('debug').innerHTML =
            'Player ready — press PLAY';
        }
      }
    });
  }

  setInterval(function () {

    if (
      player &&
      typeof player.getCurrentTime === 'function'
    ) {

      const currentTime = player.getCurrentTime();

      document.getElementById('debug').innerHTML =
        'Video time: ' + currentTime.toFixed(1) + ' seconds';

      if (currentTime >= 10 && currentTime < 13) {
        document.getElementById('testMessage').style.display = 'block';
      } else {
        document.getElementById('testMessage').style.display = 'none';
      }
    }

  }, 250);

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';

  const firstScriptTag =
    document.getElementsByTagName('script')[0];

  firstScriptTag.parentNode.insertBefore(
    tag,
    firstScriptTag
  );
</script>

</body>
</html>
