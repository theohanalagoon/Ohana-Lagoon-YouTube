========================================
*/

let nightTimer = null;

let nightIndex = 0;

let nightActive = false;


const nightStates = [

  "/show/night1",

  "/show/night2",

  "/show/night4",

  "/show/night1",

  "/show/night3",

  "/show/night2",

  "/show/night4"

];


function trigger(path) {

  fetch(WORKER + path)
    .catch(error => {

      console.log(
        "Worker error:",
        error
      );

    });

}


/*
========================================
START TRANQUIL NIGHT
========================================
*/

function startNightSky() {

  if (nightActive) {
    return;
  }


  nightActive = true;

  nightIndex = 0;


  trigger(
    nightStates[nightIndex]
  );


  nightTimer =
    setInterval(
      function () {

        if (!nightActive) {
          return;
        }


        nightIndex =
          (nightIndex + 1) %
          nightStates.length;


        trigger(
          nightStates[nightIndex]
        );

      },

      6500
    );

}


/*
========================================
STOP TRANQUIL NIGHT
========================================
*/

function stopNightSky() {

  nightActive = false;


  if (nightTimer !== null) {

    clearInterval(
      nightTimer
    );

    nightTimer = null;

  }

}

/*
========================================
ENTER A CUE
========================================
*/

function enterCue(cue) {

  document
    .getElementById("cue")
    .innerHTML =
    cue.label;


  /*
  TRANQUIL NIGHT
  */

  if (cue.type === "night") {

    stopNightSky();

    startNightSky();

    return;

  }


  /*
  DARKNESS BETWEEN LIGHTNING HITS

  Do absolutely nothing.

  The previous flash already switched
  the lights OFF.
  */

  if (cue.type === "dark") {

    stopNightSky();

    return;

  }


  /*
  STORM ENDS
  */

  if (cue.type === "nightreset") {

    stopNightSky();


    trigger(
      "/show/nightreset"
    );


    /*
    Allow reset to finish before resuming
    the normal tranquil color cycle.
    */

    setTimeout(
      function () {

        startNightSky();

      },

      4000
    );


    return;

  }


  /*
  SPECIAL SCENE / LIGHTNING
  */

  stopNightSky();


  if (cue.action) {

    trigger(
      cue.action
    );

  }

}


/*
========================================
SHOW ENGINE
========================================
*/

function updateShow() {

  if (
    !player ||
    typeof player.getCurrentTime !== "function"
  ) {
    return;
  }


  const t =
    player.getCurrentTime();


  document
    .getElementById("time")
    .innerHTML =
    "Video time: " +
    formatTime(t);


  /*
  Detect the video looping back
  to the beginning.
  */

  if (
    previousVideoTime > 1300 &&
    t < 10
  ) {

    lastCue = null;

    stopNightSky();

  }


  previousVideoTime = t;


  let active = null;


  for (const cue of cues) {

    if (
      t >= cue.start &&
      t < cue.end
    ) {

      active = cue;

      break;

    }

  }


  if (!active) {
    return;
  }


  if (active.id !== lastCue) {

    lastCue =
      active.id;

    enterCue(
      active
    );

  }

}


/*
========================================
YOUTUBE PLAYER
========================================
*/

function onYouTubeIframeAPIReady() {

  player =
    new YT.Player(
      "player",
      {

        videoId:
          VIDEO_ID,

        playerVars: {

          controls: 1,

          playsinline: 1,

          rel: 0,

          loop: 1,

          playlist:
            VIDEO_ID

        },

        events: {

          onReady:
            function () {

              document
                .getElementById("time")
                .innerHTML =
                "Player ready — press PLAY";

            },


          onStateChange:
            function (event) {

              if (
                event.data ===
                YT.PlayerState.ENDED
              ) {

                lastCue = null;

                previousVideoTime = 0;

                stopNightSky();

              }

            }

        }

      }
    );

}


/*
========================================
TIME DISPLAY
========================================
*/

function formatTime(seconds) {

  const minutes =
    Math.floor(
      seconds / 60
    );

  const secs =
    Math.floor(
      seconds % 60
    );

  const tenths =
    Math.floor(
      (seconds % 1) * 10
    );


  return (
    minutes +
    ":" +
    secs
      .toString()
      .padStart(2, "0") +
    "." +
    tenths
  );

}
